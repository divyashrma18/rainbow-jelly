<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rainbow Jelly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Cormorant:ital@1&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #f3efe9; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas#gpu-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; font-family: 'Space Grotesk', sans-serif; background: #f3efe9; color: #2a2a2a; padding: 2rem; }
  #fallback.visible { display: flex; }
  #fallback h1 { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 2.2rem; font-weight: 400; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<div id="app">
  <canvas id="gpu-canvas"></canvas>
</div>
<div id="fallback">
  <div>
    <h1>This experiment needs WebGPU.</h1>
    <p>Your browser or device doesn't support it yet. Try the latest Chrome, Edge, or Safari Technology Preview on a desktop machine.</p>
  </div>
</div>
<script>
const app = {
  canvas: null,
  context: null,
  device: null,
  format: null,
  width: 0,
  height: 0,
};

function showFallback(message) {
  const canvas = document.getElementById('gpu-canvas');
  if (canvas) canvas.style.display = 'none';
  const fb = document.getElementById('fallback');
  if (message) fb.querySelector('p').textContent = message;
  fb.classList.add('visible');
}

async function initWebGPU() {
  if (!('gpu' in navigator)) {
    throw new Error('navigator.gpu is not available');
  }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) throw new Error('No WebGPU adapter found');
  const device = await adapter.requestDevice();
  const canvas = document.getElementById('gpu-canvas');
  const context = canvas.getContext('webgpu');
  if (!context) throw new Error('Failed to get webgpu canvas context');
  const format = navigator.gpu.getPreferredCanvasFormat();

  app.canvas = canvas;
  app.context = context;
  app.device = device;
  app.format = format;

  device.lost.then((info) => {
    console.error('WebGPU device lost:', info.message);
  });

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
}

function resizeCanvas() {
  if (!app.canvas || !app.device) return;
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
  const rect = app.canvas.getBoundingClientRect();
  const width = Math.max(1, Math.floor(rect.width * dpr));
  const height = Math.max(1, Math.floor(rect.height * dpr));
  if (width === app.width && height === app.height) return;
  app.width = width;
  app.height = height;
  app.canvas.width = width;
  app.canvas.height = height;
  app.context.configure({
    device: app.device,
    format: app.format,
    alphaMode: 'opaque',
  });
}

function roundedRectSDF(x, y, hw, hh, r) {
  const qx = Math.abs(x) - (hw - r);
  const qy = Math.abs(y) - (hh - r);
  const ax = Math.max(qx, 0), ay = Math.max(qy, 0);
  return Math.sqrt(ax * ax + ay * ay) + Math.min(Math.max(qx, qy), 0) - r;
}

function buildJellyMesh(opts = {}) {
  const width = opts.width ?? 4;
  const height = opts.height ?? 1.4;
  const depth = opts.depth ?? 1.6;
  const cornerRadius = opts.cornerRadius ?? 0.15;
  const targetParticles = opts.targetParticles ?? 600;

  const hw = width / 2;
  const hh = height / 2;
  const hd = depth / 2;

  const aspectXY = width / height;
  const fillRatio = 0.88;
  const depthRatio = depth / height;
  const ny = Math.max(3, Math.round(Math.cbrt(targetParticles / (fillRatio * aspectXY * depthRatio))));
  const nx = Math.max(3, Math.round(ny * aspectXY));
  const nz = Math.max(2, Math.round(ny * depthRatio));

  const positions = [];
  const grid = new Array(nx * ny * nz).fill(-1);

  const idx3 = (ix, iy, iz) => ix + nx * (iy + ny * iz);

  for (let iz = 0; iz < nz; iz++) {
    const z = -hd + (depth * iz) / (nz - 1);
    for (let iy = 0; iy < ny; iy++) {
      const y = -hh + (height * iy) / (ny - 1);
      for (let ix = 0; ix < nx; ix++) {
        const x = -hw + (width * ix) / (nx - 1);
        const d = roundedRectSDF(x, y, hw, hh, cornerRadius);
        if (d <= 1e-6) {
          grid[idx3(ix, iy, iz)] = positions.length / 3;
          positions.push(x, y, z);
        }
      }
    }
  }

  const tets = [];
  const cubeTets = [
    [0, 1, 3, 7], [0, 1, 7, 5], [0, 5, 7, 4],
    [0, 3, 2, 7], [0, 2, 6, 7], [0, 6, 4, 7],
  ];

  for (let iz = 0; iz < nz - 1; iz++) {
    for (let iy = 0; iy < ny - 1; iy++) {
      for (let ix = 0; ix < nx - 1; ix++) {
        const c = [
          grid[idx3(ix, iy, iz)],       grid[idx3(ix + 1, iy, iz)],
          grid[idx3(ix, iy + 1, iz)],   grid[idx3(ix + 1, iy + 1, iz)],
          grid[idx3(ix, iy, iz + 1)],   grid[idx3(ix + 1, iy, iz + 1)],
          grid[idx3(ix, iy + 1, iz + 1)], grid[idx3(ix + 1, iy + 1, iz + 1)],
        ];
        if (c.some((v) => v < 0)) continue;
        for (const [a, b, cc, d] of cubeTets) {
          tets.push(c[a], c[b], c[cc], c[d]);
        }
      }
    }
  }

  const positionsArr = new Float32Array(positions);
  const tetsArr = new Uint32Array(tets);

  let minY = Infinity, maxY = -Infinity;
  for (let i = 1; i < positionsArr.length; i += 3) {
    if (positionsArr[i] < minY) minY = positionsArr[i];
    if (positionsArr[i] > maxY) maxY = positionsArr[i];
  }

  return {
    positions: positionsArr,
    tets: tetsArr,
    particleCount: positionsArr.length / 3,
    tetCount: tetsArr.length / 4,
    layerHeightMin: minY,
    layerHeightMax: maxY,
  };
}

function mat3Multiply(a, b, out) {
  out[0] = a[0]*b[0] + a[3]*b[1] + a[6]*b[2];
  out[1] = a[1]*b[0] + a[4]*b[1] + a[7]*b[2];
  out[2] = a[2]*b[0] + a[5]*b[1] + a[8]*b[2];
  out[3] = a[0]*b[3] + a[3]*b[4] + a[6]*b[5];
  out[4] = a[1]*b[3] + a[4]*b[4] + a[7]*b[5];
  out[5] = a[2]*b[3] + a[5]*b[4] + a[8]*b[5];
  out[6] = a[0]*b[6] + a[3]*b[7] + a[6]*b[8];
  out[7] = a[1]*b[6] + a[4]*b[7] + a[7]*b[8];
  out[8] = a[2]*b[6] + a[5]*b[7] + a[8]*b[8];
  return out;
}

function mat3Determinant(m) {
  return m[0]*(m[4]*m[8]-m[5]*m[7]) - m[3]*(m[1]*m[8]-m[2]*m[7]) + m[6]*(m[1]*m[5]-m[2]*m[4]);
}

function mat3Inverse(m, out) {
  const det = mat3Determinant(m);
  const invDet = Math.abs(det) > 1e-12 ? 1 / det : 0;
  out[0] = (m[4]*m[8]-m[5]*m[7]) * invDet;
  out[1] = (m[2]*m[7]-m[1]*m[8]) * invDet;
  out[2] = (m[1]*m[5]-m[2]*m[4]) * invDet;
  out[3] = (m[5]*m[6]-m[3]*m[8]) * invDet;
  out[4] = (m[0]*m[8]-m[2]*m[6]) * invDet;
  out[5] = (m[2]*m[3]-m[0]*m[5]) * invDet;
  out[6] = (m[3]*m[7]-m[4]*m[6]) * invDet;
  out[7] = (m[1]*m[6]-m[0]*m[7]) * invDet;
  out[8] = (m[0]*m[4]-m[1]*m[3]) * invDet;
  return out;
}

// Polar decomposition via Jacobi-free iterative method (McAdams/Müller et al.) — extracts best-fit
// rotation R from F into `out` (column-major 3x3, matching mat3Multiply's convention), warm-started
// from `q` (quaternion [w,x,y,z], mutated in place so the caller can persist it across frames).
// F is interpreted column-major: F = [c0x,c0y,c0z, c1x,c1y,c1z, c2x,c2y,c2z].
const _rotScratch = { r: new Float32Array(9) };
function extractRotation(F, q, out) {
  const r = _rotScratch.r;
  for (let iter = 0; iter < 8; iter++) {
    const qx = q[1], qy = q[2], qz = q[3], qw = q[0];
    // R as column-major, built from the quaternion, matching F's column-major layout.
    r[0] = 1-2*(qy*qy+qz*qz); r[3] = 2*(qx*qy-qz*qw);   r[6] = 2*(qx*qz+qy*qw);
    r[1] = 2*(qx*qy+qz*qw);   r[4] = 1-2*(qx*qx+qz*qz); r[7] = 2*(qy*qz-qx*qw);
    r[2] = 2*(qx*qz-qy*qw);   r[5] = 2*(qy*qz+qx*qw);   r[8] = 1-2*(qx*qx+qy*qy);
    // omega = sum_i (R_col_i x F_col_i) — drives R toward alignment with F.
    // Column-wise cross products: R columns are (r0,r1,r2),(r3,r4,r5),(r6,r7,r8); F columns analogous.
    const r0x=r[0],r0y=r[1],r0z=r[2], r1x=r[3],r1y=r[4],r1z=r[5], r2x=r[6],r2y=r[7],r2z=r[8];
    const f0x=F[0],f0y=F[1],f0z=F[2], f1x=F[3],f1y=F[4],f1z=F[5], f2x=F[6],f2y=F[7],f2z=F[8];
    const omx = (r0y*f0z-r0z*f0y) + (r1y*f1z-r1z*f1y) + (r2y*f2z-r2z*f2y);
    const omy = (r0z*f0x-r0x*f0z) + (r1z*f1x-r1x*f1z) + (r2z*f2x-r2x*f2z);
    const omz = (r0x*f0y-r0y*f0x) + (r1x*f1y-r1y*f1x) + (r2x*f2y-r2y*f2x);
    const dot = (r0x*f0x+r0y*f0y+r0z*f0z) + (r1x*f1x+r1y*f1y+r1z*f1z) + (r2x*f2x+r2y*f2y+r2z*f2z);
    const omegaLen2 = omx*omx+omy*omy+omz*omz;
    if (omegaLen2 < 1e-9) break;
    const denom = Math.abs(dot) + 1e-6;
    const angle = Math.sqrt(omegaLen2) / denom;
    if (angle < 1e-9) break;
    const invLen = 1 / Math.sqrt(omegaLen2);
    const ax = omx*invLen, ay = omy*invLen, az = omz*invLen;
    const half = Math.min(angle, 0.5) / 2; // clamp step to keep iteration stable near large errors
    const s = Math.sin(half);
    const dqw = Math.cos(half), dqx = ax*s, dqy = ay*s, dqz = az*s;
    const nqw = dqw*q[0] - dqx*q[1] - dqy*q[2] - dqz*q[3];
    const nqx = dqw*q[1] + dqx*q[0] + dqy*q[3] - dqz*q[2];
    const nqy = dqw*q[2] - dqx*q[3] + dqy*q[0] + dqz*q[1];
    const nqz = dqw*q[3] + dqx*q[2] - dqy*q[1] + dqz*q[0];
    const len = Math.hypot(nqw, nqx, nqy, nqz) || 1;
    q[0] = nqw/len; q[1] = nqx/len; q[2] = nqy/len; q[3] = nqz/len;
  }
  const qx = q[1], qy = q[2], qz = q[3], qw = q[0];
  out[0] = 1-2*(qy*qy+qz*qz); out[3] = 2*(qx*qy-qz*qw);   out[6] = 2*(qx*qz+qy*qw);
  out[1] = 2*(qx*qy+qz*qw);   out[4] = 1-2*(qx*qx+qz*qz); out[7] = 2*(qy*qz-qx*qw);
  out[2] = 2*(qx*qz-qy*qw);   out[5] = 2*(qy*qz+qx*qw);   out[8] = 1-2*(qx*qx+qy*qy);
  return out;
}

const STAGE_RADIUS = 3.0;

class SoftBody {
  constructor(meshData, opts = {}) {
    const n = meshData.particleCount;
    const t = meshData.tetCount;
    this.particleCount = n;
    this.tetCount = t;
    this.restPositions = new Float32Array(meshData.positions);
    this.positions = new Float32Array(meshData.positions);
    this.prevPositions = new Float32Array(meshData.positions);
    this.velocities = new Float32Array(n * 3);
    this.invMass = new Float32Array(n).fill(1);
    this.tets = new Uint32Array(meshData.tets);
    this.tetRestVolumes = new Float32Array(t); // signed
    this.tetRestInvMatrices = new Float32Array(t * 9); // column-major, columns = rest edges e1,e2,e3
    this.tetStiffness = new Float32Array(t);
    this.tetQuat = new Float32Array(t * 4); // warm-start rotation per tet, (w,x,y,z)

    const layerFn = opts.layerStiffness || (() => 1.0);
    const m = new Float32Array(9);
    const inv = new Float32Array(9);
    let degenerateCount = 0;

    for (let i = 0; i < t; i++) {
      const a = this.tets[i*4], b = this.tets[i*4+1], c = this.tets[i*4+2], d = this.tets[i*4+3];
      const ax = this.restPositions[a*3], ay = this.restPositions[a*3+1], az = this.restPositions[a*3+2];
      const e1x = this.restPositions[b*3]-ax, e1y = this.restPositions[b*3+1]-ay, e1z = this.restPositions[b*3+2]-az;
      const e2x = this.restPositions[c*3]-ax, e2y = this.restPositions[c*3+1]-ay, e2z = this.restPositions[c*3+2]-az;
      const e3x = this.restPositions[d*3]-ax, e3y = this.restPositions[d*3+1]-ay, e3z = this.restPositions[d*3+2]-az;
      // column-major: column 0 = e1, column 1 = e2, column 2 = e3
      m[0]=e1x; m[1]=e1y; m[2]=e1z;  m[3]=e2x; m[4]=e2y; m[5]=e2z;  m[6]=e3x; m[7]=e3y; m[8]=e3z;
      const vol = mat3Determinant(m) / 6;
      this.tetRestVolumes[i] = vol; // keep sign; degenerate/inverted rest tets get caught below
      if (Math.abs(vol) < 1e-9) {
        degenerateCount++;
        // leave inverse as zero (mat3Inverse already guards det≈0); constraint loop skips via stiffness*0 below
      }
      mat3Inverse(m, inv);
      for (let k = 0; k < 9; k++) this.tetRestInvMatrices[i*9+k] = inv[k];
      const centroidY = (ay + this.restPositions[b*3+1] + this.restPositions[c*3+1] + this.restPositions[d*3+1]) / 4;
      this.tetStiffness[i] = Math.abs(vol) < 1e-9 ? 0 : layerFn(centroidY);
      this.tetQuat[i*4] = 1; // identity quaternion warm start
    }
    if (degenerateCount > 0) {
      console.warn('buildJellyMesh/SoftBody: skipped', degenerateCount, 'degenerate rest tets (zero volume)');
    }

    const massAccum = new Float32Array(n);
    const density = 1.0;
    for (let i = 0; i < t; i++) {
      const share = (Math.abs(this.tetRestVolumes[i]) * density) / 4;
      for (let k = 0; k < 4; k++) massAccum[this.tets[i*4+k]] += share;
    }
    for (let i = 0; i < n; i++) {
      this.invMass[i] = massAccum[i] > 1e-9 ? 1 / massAccum[i] : 0;
    }
    this._totalMass = 0;
    for (let i = 0; i < n; i++) this._totalMass += massAccum[i];

    // Unique undirected edge list (for damping + wireframe), built once from tet faces.
    const edgeSet = new Map();
    const edgePairsLocal = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
    for (let i = 0; i < t; i++) {
      const v = [this.tets[i*4], this.tets[i*4+1], this.tets[i*4+2], this.tets[i*4+3]];
      for (const [p, q] of edgePairsLocal) {
        const lo = Math.min(v[p], v[q]), hi = Math.max(v[p], v[q]);
        edgeSet.set(lo * n + hi, [lo, hi]);
      }
    }
    this.edges = new Uint32Array(edgeSet.size * 2);
    let ei = 0;
    for (const [lo, hi] of edgeSet.values()) { this.edges[ei++] = lo; this.edges[ei++] = hi; }
    this.edgeCount = edgeSet.size;

    // Boundary surface: tet faces that belong to exactly one tet, wound so normals point away
    // from the tet's fourth (opposite) vertex, i.e. outward from the body.
    const faceMap = new Map();
    const faceOpp = [[1,2,3,0],[0,2,3,1],[0,1,3,2],[0,1,2,3]];
    const rp = this.restPositions;
    for (let i = 0; i < t; i++) {
      for (const [p, q, r, o] of faceOpp) {
        const v0 = this.tets[i*4+p], v1 = this.tets[i*4+q], v2 = this.tets[i*4+r], vo = this.tets[i*4+o];
        const lo = Math.min(v0, v1, v2), hi = Math.max(v0, v1, v2), mid = v0 + v1 + v2 - lo - hi;
        const key = (lo * n + mid) * n + hi;
        const existing = faceMap.get(key);
        if (existing) { existing.count++; continue; }
        const ux = rp[v1*3]-rp[v0*3], uy = rp[v1*3+1]-rp[v0*3+1], uz = rp[v1*3+2]-rp[v0*3+2];
        const wx = rp[v2*3]-rp[v0*3], wy = rp[v2*3+1]-rp[v0*3+1], wz = rp[v2*3+2]-rp[v0*3+2];
        const nx = uy*wz-uz*wy, ny = uz*wx-ux*wz, nz = ux*wy-uy*wx;
        const toOpp = nx*(rp[vo*3]-rp[v0*3]) + ny*(rp[vo*3+1]-rp[v0*3+1]) + nz*(rp[vo*3+2]-rp[v0*3+2]);
        faceMap.set(key, { count: 1, tri: toOpp > 0 ? [v0, v2, v1] : [v0, v1, v2] });
      }
    }
    const surface = [];
    for (const f of faceMap.values()) if (f.count === 1) surface.push(f.tri[0], f.tri[1], f.tri[2]);
    this.surfaceTris = new Uint32Array(surface);
    this.surfaceTriCount = surface.length / 3;

    this.grabs = [];

    // Reusable scratch to avoid per-substep, per-tet allocation in the hot loop.
    this._F = new Float32Array(9);
    this._R = new Float32Array(9);
    this._q = new Float32Array(4);
  }

  step(dt, globalParams) {
    const n = this.particleCount;
    const g = globalParams.gravity;
    const floorY = globalParams.floorY;
    const firmness = globalParams.firmness;
    const damping = globalParams.damping;

    for (let i = 0; i < n; i++) {
      if (this.invMass[i] === 0) continue;
      this.prevPositions[i*3] = this.positions[i*3];
      this.prevPositions[i*3+1] = this.positions[i*3+1];
      this.prevPositions[i*3+2] = this.positions[i*3+2];
      this.velocities[i*3]   += g[0] * dt;
      this.velocities[i*3+1] += g[1] * dt;
      this.velocities[i*3+2] += g[2] * dt;
      this.positions[i*3]   += this.velocities[i*3] * dt;
      this.positions[i*3+1] += this.velocities[i*3+1] * dt;
      this.positions[i*3+2] += this.velocities[i*3+2] * dt;
    }

    this._solveTetConstraints(dt, firmness);
    this._solveGrabs(dt);
    this._solveFloorContact(floorY);
    this._solveStageBounds(STAGE_RADIUS);

    for (let i = 0; i < n; i++) {
      if (this.invMass[i] === 0) continue;
      this.velocities[i*3]   = (this.positions[i*3]   - this.prevPositions[i*3])   / dt;
      this.velocities[i*3+1] = (this.positions[i*3+1] - this.prevPositions[i*3+1]) / dt;
      this.velocities[i*3+2] = (this.positions[i*3+2] - this.prevPositions[i*3+2]) / dt;
    }

    this._applyEdgeDamping(damping);
  }

  // Maps firmness in [0,1] to a compliance (XPBD alpha), log-interpolated between a soft and a stiff
  // bound so the whole slider range feels distinct (linear-in-(1-f) made most of the range mushy).
  static _complianceFromFirmness(firmness, alphaSoft, alphaStiff) {
    const f = Math.min(1, Math.max(0, firmness));
    const logSoft = Math.log(alphaSoft), logStiff = Math.log(alphaStiff);
    return Math.exp(logSoft + (logStiff - logSoft) * f);
  }

  _solveTetConstraints(dt, firmness) {
    const t = this.tetCount;
    // Elastic compliance is 1/modulus, divided per tet by rest volume (and layer stiffness) below, so
    // stiffness doesn't depend on mesh resolution. Volume stays near-incompressible at every firmness.
    const alphaElastic = SoftBody._complianceFromFirmness(firmness, 1 / 1.5e3, 1 / 1.5e6);
    const alphaVolume = SoftBody._complianceFromFirmness(firmness, 1e-9, 1e-11);
    const dtSq = dt * dt;
    const complianceElasticBase = alphaElastic / dtSq;
    const complianceVolumeBase = alphaVolume / dtSq;

    const F = this._F, R = this._R, q4 = this._q;
    const positions = this.positions;
    const invMass = this.invMass, tets = this.tets;
    const tetRestInvMatrices = this.tetRestInvMatrices, tetRestVolumes = this.tetRestVolumes;
    const tetStiffness = this.tetStiffness, tetQuat = this.tetQuat;

    for (let i = 0; i < t; i++) {
      const stiffness = tetStiffness[i];
      if (stiffness === 0) continue; // degenerate rest tet, skip

      const a = tets[i*4], b = tets[i*4+1], c = tets[i*4+2], d = tets[i*4+3];
      const wa = invMass[a], wb = invMass[b], wc = invMass[c], wd = invMass[d];
      if (wa + wb + wc + wd === 0) continue;

      const ax = positions[a*3], ay = positions[a*3+1], az = positions[a*3+2];
      const e1x = positions[b*3]-ax, e1y = positions[b*3+1]-ay, e1z = positions[b*3+2]-az;
      const e2x = positions[c*3]-ax, e2y = positions[c*3+1]-ay, e2z = positions[c*3+2]-az;
      const e3x = positions[d*3]-ax, e3y = positions[d*3+1]-ay, e3z = positions[d*3+2]-az;
      // D column-major: columns = current edges (matches tetRestInvMatrices' column-major rest edges)
      const D0=e1x,D1=e1y,D2=e1z, D3=e2x,D4=e2y,D5=e2z, D6=e3x,D7=e3y,D8=e3z;
      const ir0=tetRestInvMatrices[i*9],ir1=tetRestInvMatrices[i*9+1],ir2=tetRestInvMatrices[i*9+2];
      const ir3=tetRestInvMatrices[i*9+3],ir4=tetRestInvMatrices[i*9+4],ir5=tetRestInvMatrices[i*9+5];
      const ir6=tetRestInvMatrices[i*9+6],ir7=tetRestInvMatrices[i*9+7],ir8=tetRestInvMatrices[i*9+8];
      // out = D * invRest, column-major: out_col_j = D * invRest_col_j
      F[0] = D0*ir0+D3*ir1+D6*ir2; F[1] = D1*ir0+D4*ir1+D7*ir2; F[2] = D2*ir0+D5*ir1+D8*ir2;
      F[3] = D0*ir3+D3*ir4+D6*ir5; F[4] = D1*ir3+D4*ir4+D7*ir5; F[5] = D2*ir3+D5*ir4+D8*ir5;
      F[6] = D0*ir6+D3*ir7+D6*ir8; F[7] = D1*ir6+D4*ir7+D7*ir8; F[8] = D2*ir6+D5*ir7+D8*ir8;

      q4[0]=tetQuat[i*4]; q4[1]=tetQuat[i*4+1]; q4[2]=tetQuat[i*4+2]; q4[3]=tetQuat[i*4+3];
      extractRotation(F, q4, R);
      tetQuat[i*4]=q4[0]; tetQuat[i*4+1]=q4[1]; tetQuat[i*4+2]=q4[2]; tetQuat[i*4+3]=q4[3];

      const vol = tetRestVolumes[i];

      // Co-rotational XPBD constraint C = ||F - R||_F (zero for any rigid motion, so it never fights
      // rotation; R is a proper rotation, so inverted tets are driven back to positive orientation).
      // dC/dF = (F - R)/C (exact by the envelope theorem, since R minimises ||F - R||), and
      // dC/dx_j = (dC/dF) · Dm^-T column j for j = b,c,d with dC/dx_a = -(sum). The gradients sum to
      // zero and C is rotation-invariant, so the update conserves linear and angular momentum.
      let g0 = F[0]-R[0], g1 = F[1]-R[1], g2 = F[2]-R[2];
      let g3 = F[3]-R[3], g4 = F[4]-R[4], g5 = F[5]-R[5];
      let g6 = F[6]-R[6], g7 = F[7]-R[7], g8 = F[8]-R[8];
      const Cel = Math.sqrt(g0*g0+g1*g1+g2*g2+g3*g3+g4*g4+g5*g5+g6*g6+g7*g7+g8*g8);
      if (Cel > 1e-9) {
        const invC = 1 / Cel;
        g0*=invC; g1*=invC; g2*=invC; g3*=invC; g4*=invC; g5*=invC; g6*=invC; g7*=invC; g8*=invC;
        // G(r,k) = g[k*3+r]; Dm^-1(j,k) = ir[k*3+j]
        const gbx = g0*ir0+g3*ir3+g6*ir6, gby = g1*ir0+g4*ir3+g7*ir6, gbz = g2*ir0+g5*ir3+g8*ir6;
        const gcx = g0*ir1+g3*ir4+g6*ir7, gcy = g1*ir1+g4*ir4+g7*ir7, gcz = g2*ir1+g5*ir4+g8*ir7;
        const gdx = g0*ir2+g3*ir5+g6*ir8, gdy = g1*ir2+g4*ir5+g7*ir8, gdz = g2*ir2+g5*ir5+g8*ir8;
        const gax = -(gbx+gcx+gdx), gay = -(gby+gcy+gdy), gaz = -(gbz+gcz+gdz);
        const wGrad = wa*(gax*gax+gay*gay+gaz*gaz) + wb*(gbx*gbx+gby*gby+gbz*gbz)
                    + wc*(gcx*gcx+gcy*gcy+gcz*gcz) + wd*(gdx*gdx+gdy*gdy+gdz*gdz);
        const alphaTilde = complianceElasticBase / (stiffness * Math.abs(vol));
        const lambda = -Cel / (wGrad + alphaTilde);
        positions[a*3] += wa*lambda*gax; positions[a*3+1] += wa*lambda*gay; positions[a*3+2] += wa*lambda*gaz;
        positions[b*3] += wb*lambda*gbx; positions[b*3+1] += wb*lambda*gby; positions[b*3+2] += wb*lambda*gbz;
        positions[c*3] += wc*lambda*gcx; positions[c*3+1] += wc*lambda*gcy; positions[c*3+2] += wc*lambda*gcz;
        positions[d*3] += wd*lambda*gdx; positions[d*3+1] += wd*lambda*gdy; positions[d*3+2] += wd*lambda*gdz;
      }

      // Volume constraint (recompute edges after elastic correction).
      const bx = positions[b*3]-positions[a*3], by = positions[b*3+1]-positions[a*3+1], bz = positions[b*3+2]-positions[a*3+2];
      const cx2 = positions[c*3]-positions[a*3], cy2 = positions[c*3+1]-positions[a*3+1], cz2 = positions[c*3+2]-positions[a*3+2];
      const dx2 = positions[d*3]-positions[a*3], dy2 = positions[d*3+1]-positions[a*3+1], dz2 = positions[d*3+2]-positions[a*3+2];
      const gradBx=(cy2*dz2-cz2*dy2)/6, gradBy=(cz2*dx2-cx2*dz2)/6, gradBz=(cx2*dy2-cy2*dx2)/6;
      const gradCx=(dy2*bz-dz2*by)/6, gradCy=(dz2*bx-dx2*bz)/6, gradCz=(dx2*by-dy2*bx)/6;
      const gradDx=(by*cz2-bz*cy2)/6, gradDy=(bz*cx2-bx*cz2)/6, gradDz=(bx*cy2-by*cx2)/6;
      const gradAx=-(gradBx+gradCx+gradDx), gradAy=-(gradBy+gradCy+gradDy), gradAz=-(gradBz+gradCz+gradDz);
      const currentVol = (bx*(cy2*dz2-cz2*dy2) + by*(cz2*dx2-cx2*dz2) + bz*(cx2*dy2-cy2*dx2)) / 6;
      const C = currentVol - vol;

      const wSumVol = wa*(gradAx*gradAx+gradAy*gradAy+gradAz*gradAz)
                    + wb*(gradBx*gradBx+gradBy*gradBy+gradBz*gradBz)
                    + wc*(gradCx*gradCx+gradCy*gradCy+gradCz*gradCz)
                    + wd*(gradDx*gradDx+gradDy*gradDy+gradDz*gradDz);
      if (wSumVol + complianceVolumeBase > 1e-9) {
        const lambda = -C / (wSumVol + complianceVolumeBase);
        positions[a*3]   += wa * gradAx * lambda;
        positions[a*3+1] += wa * gradAy * lambda;
        positions[a*3+2] += wa * gradAz * lambda;
        positions[b*3]   += wb * gradBx * lambda;
        positions[b*3+1] += wb * gradBy * lambda;
        positions[b*3+2] += wb * gradBz * lambda;
        positions[c*3]   += wc * gradCx * lambda;
        positions[c*3+1] += wc * gradCy * lambda;
        positions[c*3+2] += wc * gradCz * lambda;
        positions[d*3]   += wd * gradDx * lambda;
        positions[d*3+1] += wd * gradDy * lambda;
        positions[d*3+2] += wd * gradDz * lambda;
      }
    }
  }

  // Each grab pulls its patch toward `target + Rot(axis, twist) · offset_i` as a soft single-
  // particle XPBD constraint, scaled per particle by a smooth radial falloff weight.
  _solveGrabs(dt) {
    if (this.grabs.length === 0) return;
    const p = this.positions, invMass = this.invMass;
    const dtSq = dt * dt;
    for (const g of this.grabs) {
      const alphaTilde = g.compliance / dtSq;
      const [ux, uy, uz] = g.axis;
      const c = Math.cos(g.twist), s = Math.sin(g.twist), k = 1 - c;
      const r00 = c + ux*ux*k,    r01 = ux*uy*k - uz*s, r02 = ux*uz*k + uy*s;
      const r10 = uy*ux*k + uz*s, r11 = c + uy*uy*k,    r12 = uy*uz*k - ux*s;
      const r20 = uz*ux*k - uy*s, r21 = uz*uy*k + ux*s, r22 = c + uz*uz*k;
      const [tx, ty, tz] = g.target;
      for (let j = 0; j < g.indices.length; j++) {
        const idx = g.indices[j];
        const w = invMass[idx];
        if (w === 0) continue;
        const ox = g.offsets[j*3], oy = g.offsets[j*3+1], oz = g.offsets[j*3+2];
        const gx = tx + r00*ox + r01*oy + r02*oz;
        const gy = ty + r10*ox + r11*oy + r12*oz;
        const gz = tz + r20*ox + r21*oy + r22*oz;
        const f = (w / (w + alphaTilde)) * g.weights[j];
        let cx = (gx - p[idx*3]) * f, cy = (gy - p[idx*3+1]) * f, cz = (gz - p[idx*3+2]) * f;
        // Cap the pull speed so a pointer flick (or a target jump) can't yank particles at hundreds
        // of units/s and fling the whole body; the spring stays soft regardless of pointer speed.
        const len = Math.hypot(cx, cy, cz), maxStep = HAND_MAX_PULL_SPEED * dt;
        if (len > maxStep) { const s = maxStep / len; cx *= s; cy *= s; cz *= s; }
        p[idx*3] += cx; p[idx*3+1] += cy; p[idx*3+2] += cz;
      }
    }
  }

  // Invisible walls at the stage edge: there is no camera control, so a thrown piece must not be
  // able to leave the view for good.
  _solveStageBounds(radius) {
    const p = this.positions, r2 = radius * radius;
    for (let i = 0; i < this.particleCount; i++) {
      if (this.invMass[i] === 0) continue;
      const x = p[i*3], z = p[i*3+2], d2 = x*x + z*z;
      if (d2 > r2) { const s = radius / Math.sqrt(d2); p[i*3] = x * s; p[i*3+2] = z * s; }
    }
  }

  _solveFloorContact(floorY) {
    // PBD Coulomb friction gated on instantaneous per-substep penetration degenerates at a resting
    // contact: once the particle settles, gravity only re-penetrates it by a tiny amount each
    // substep (g * subDt^2), so `penetration` is ~0 and any threshold scaled by it (muStatic *
    // penetration, muKinetic * penetration) lets almost all tangential displacement through
    // uncorrected — the body then creeps sideways forever under a sustained but never-arrested
    // "kinetic slip". Gate on total accumulated penetration depth below the floor instead (how far
    // the particle has been driven into contact relative to its own radius of influence is not
    // tracked here, so use a small fixed depth band characteristic of one settled substep) — in
    // that band, treat contact as fully static (no slip), which is the physically correct limit for
    // an at-rest body and matches the spec's requirement that pieces settle on the floor rather than
    // sliding indefinitely.
    const n = this.particleCount;
    const stickBand = 0.01; // particles resting within this depth of the floor don't slide at all
    const muKinetic = 0.4;
    for (let i = 0; i < n; i++) {
      if (this.invMass[i] === 0) continue;
      if (this.positions[i*3+1] < floorY) {
        const penetration = floorY - this.positions[i*3+1];
        this.positions[i*3+1] = floorY;
        const dx = this.positions[i*3]   - this.prevPositions[i*3];
        const dz = this.positions[i*3+2] - this.prevPositions[i*3+2];
        if (penetration <= stickBand) {
          this.positions[i*3]   -= dx;
          this.positions[i*3+2] -= dz;
        } else {
          const tangentialDist = Math.hypot(dx, dz);
          if (tangentialDist > 1e-9) {
            const scale = Math.min(1, (muKinetic * penetration) / tangentialDist);
            this.positions[i*3]   -= dx * scale;
            this.positions[i*3+2] -= dz * scale;
          }
        }
      }
    }
  }

  _applyEdgeDamping(damping) {
    if (damping <= 0) return;
    const k = Math.min(1, damping);
    const edges = this.edges, edgeCount = this.edgeCount;
    const positions = this.positions, velocities = this.velocities, invMass = this.invMass;
    for (let ei = 0; ei < edgeCount; ei++) {
      const a = edges[ei*2], b = edges[ei*2+1];
      const wa = invMass[a], wb = invMass[b];
      if (wa + wb === 0) continue;
      let nx = positions[a*3]-positions[b*3], ny = positions[a*3+1]-positions[b*3+1], nz = positions[a*3+2]-positions[b*3+2];
      const len = Math.hypot(nx, ny, nz);
      if (len < 1e-9) continue;
      nx /= len; ny /= len; nz /= len;
      const rvx = velocities[a*3]   - velocities[b*3];
      const rvy = velocities[a*3+1] - velocities[b*3+1];
      const rvz = velocities[a*3+2] - velocities[b*3+2];
      // Only damp the component of relative velocity ALONG the edge (stretch/compression), so a
      // rigid rotation or translation of the whole tet (which moves endpoints together, not apart)
      // is left untouched — matches the spec's "free fall/tumbling undamped".
      const along = rvx*nx + rvy*ny + rvz*nz;
      const corrX = nx * along * k, corrY = ny * along * k, corrZ = nz * along * k;
      const moveA = wa / (wa + wb), moveB = wb / (wa + wb);
      velocities[a*3]   -= corrX * moveA;
      velocities[a*3+1] -= corrY * moveA;
      velocities[a*3+2] -= corrZ * moveA;
      velocities[b*3]   += corrX * moveB;
      velocities[b*3+1] += corrY * moveB;
      velocities[b*3+2] += corrZ * moveB;
    }
  }

  computeStats() {
    let volume = 0;
    let restVolume = 0;
    let kinetic = 0;
    for (let i = 0; i < this.tetCount; i++) {
      const a = this.tets[i*4], b = this.tets[i*4+1], c = this.tets[i*4+2], d = this.tets[i*4+3];
      const bx = this.positions[b*3]-this.positions[a*3], by = this.positions[b*3+1]-this.positions[a*3+1], bz = this.positions[b*3+2]-this.positions[a*3+2];
      const cx = this.positions[c*3]-this.positions[a*3], cy = this.positions[c*3+1]-this.positions[a*3+1], cz = this.positions[c*3+2]-this.positions[a*3+2];
      const dx = this.positions[d*3]-this.positions[a*3], dy = this.positions[d*3+1]-this.positions[a*3+1], dz = this.positions[d*3+2]-this.positions[a*3+2];
      const crossX = cy*dz-cz*dy, crossY = cz*dx-cx*dz, crossZ = cx*dy-cy*dx;
      volume += Math.abs(bx*crossX+by*crossY+bz*crossZ) / 6;
      restVolume += Math.abs(this.tetRestVolumes[i]);
    }
    for (let i = 0; i < this.particleCount; i++) {
      if (this.invMass[i] === 0) continue;
      const mass = 1 / this.invMass[i];
      const vx = this.velocities[i*3], vy = this.velocities[i*3+1], vz = this.velocities[i*3+2];
      kinetic += 0.5 * mass * (vx*vx+vy*vy+vz*vz);
    }
    return {
      mass: this._totalMass,
      volumeRatio: restVolume > 0 ? volume / restVolume : 1,
      kineticEnergy: kinetic,
    };
  }
}

class Clock {
  constructor(hz = 60, maxCatchupSteps = 5) {
    this.dt = 1 / hz;
    this.accumulator = 0;
    this.lastTime = null;
    this.maxCatchupSteps = maxCatchupSteps;
  }
  tick(nowMs, stepFn) {
    if (this.lastTime === null) { this.lastTime = nowMs; return; }
    let frameTime = (nowMs - this.lastTime) / 1000;
    this.lastTime = nowMs;
    frameTime = Math.min(frameTime, this.dt * this.maxCatchupSteps);
    this.accumulator += frameTime;
    let steps = 0;
    while (this.accumulator >= this.dt && steps < this.maxCatchupSteps) {
      stepFn(this.dt);
      this.accumulator -= this.dt;
      steps++;
    }
  }
}

const mat4 = {
  perspective(fovY, aspect, near, far) {
    const f = 1 / Math.tan(fovY / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0,
    ]);
  },
  lookAt(eye, target, up) {
    const zx = eye[0]-target[0], zy = eye[1]-target[1], zz = eye[2]-target[2];
    let zl = Math.hypot(zx, zy, zz) || 1;
    const z = [zx/zl, zy/zl, zz/zl];
    const xx = up[1]*z[2]-up[2]*z[1], xy = up[2]*z[0]-up[0]*z[2], xz = up[0]*z[1]-up[1]*z[0];
    let xl = Math.hypot(xx, xy, xz) || 1;
    const x = [xx/xl, xy/xl, xz/xl];
    const y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
    return new Float32Array([
      x[0], y[0], z[0], 0,
      x[1], y[1], z[1], 0,
      x[2], y[2], z[2], 0,
      -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),
      -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
      -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]), 1,
    ]);
  },
  multiply(a, b) {
    const out = new Float32Array(16);
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        out[c*4+r] = a[0*4+r]*b[c*4+0] + a[1*4+r]*b[c*4+1] + a[2*4+r]*b[c*4+2] + a[3*4+r]*b[c*4+3];
      }
    }
    return out;
  },
};

const camera = {
  eye: [4.4, 3.1, 5.6],
  target: [0, 0, 0],
  up: [0, 1, 0],
  fovY: Math.PI / 4,
  near: 0.1,
  far: 100,
};

function getViewProjMatrix(cam, aspect) {
  const view = mat4.lookAt(cam.eye, cam.target, cam.up);
  const proj = mat4.perspective(cam.fovY, aspect, cam.near, cam.far);
  return mat4.multiply(proj, view);
}

// Column-major 4x4 inverse (cofactor expansion). Returns null for a singular matrix.
mat4.invert = function (m) {
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7];
  const a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10, b03=a01*a12-a02*a11;
  const b04=a01*a13-a03*a11, b05=a02*a13-a03*a12, b06=a20*a31-a21*a30, b07=a20*a32-a22*a30;
  const b08=a20*a33-a23*a30, b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det = b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if (Math.abs(det) < 1e-20) return null;
  det = 1 / det;
  return new Float32Array([
    (a11*b11-a12*b10+a13*b09)*det, (a02*b10-a01*b11-a03*b09)*det, (a31*b05-a32*b04+a33*b03)*det, (a22*b04-a21*b05-a23*b03)*det,
    (a12*b08-a10*b11-a13*b07)*det, (a00*b11-a02*b08+a03*b07)*det, (a32*b02-a30*b05-a33*b01)*det, (a20*b05-a22*b02+a23*b01)*det,
    (a10*b10-a11*b08+a13*b06)*det, (a01*b08-a00*b10-a03*b06)*det, (a30*b04-a31*b02+a33*b00)*det, (a21*b02-a20*b04-a23*b00)*det,
    (a11*b07-a10*b09-a12*b06)*det, (a00*b09-a01*b07+a02*b06)*det, (a31*b01-a30*b03-a32*b00)*det, (a20*b03-a21*b01+a22*b00)*det,
  ]);
};

function transformPoint(m, x, y, z) {
  const w = m[3]*x + m[7]*y + m[11]*z + m[15];
  return [
    (m[0]*x + m[4]*y + m[8]*z + m[12]) / w,
    (m[1]*x + m[5]*y + m[9]*z + m[13]) / w,
    (m[2]*x + m[6]*y + m[10]*z + m[14]) / w,
  ];
}

function screenToRay(clientX, clientY, invViewProj, rect) {
  const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ny = 1 - ((clientY - rect.top) / rect.height) * 2;
  const near = transformPoint(invViewProj, nx, ny, -1);
  const far = transformPoint(invViewProj, nx, ny, 1);
  const dx = far[0]-near[0], dy = far[1]-near[1], dz = far[2]-near[2];
  const len = Math.hypot(dx, dy, dz) || 1;
  return { origin: near, dir: [dx/len, dy/len, dz/len] };
}

// Möller–Trumbore against the body's outward surface triangles; nearest front-facing hit wins.
function pickBody(body, ray) {
  const p = body.positions, tris = body.surfaceTris;
  const [ox, oy, oz] = ray.origin, [dx, dy, dz] = ray.dir;
  let best = null;
  for (let i = 0; i < body.surfaceTriCount; i++) {
    const i0 = tris[i*3], i1 = tris[i*3+1], i2 = tris[i*3+2];
    const e1x = p[i1*3]-p[i0*3], e1y = p[i1*3+1]-p[i0*3+1], e1z = p[i1*3+2]-p[i0*3+2];
    const e2x = p[i2*3]-p[i0*3], e2y = p[i2*3+1]-p[i0*3+1], e2z = p[i2*3+2]-p[i0*3+2];
    const hx = dy*e2z-dz*e2y, hy = dz*e2x-dx*e2z, hz = dx*e2y-dy*e2x;
    const det = e1x*hx + e1y*hy + e1z*hz;
    if (Math.abs(det) < 1e-12) continue;
    const inv = 1 / det;
    const sx = ox-p[i0*3], sy = oy-p[i0*3+1], sz = oz-p[i0*3+2];
    const u = (sx*hx + sy*hy + sz*hz) * inv;
    if (u < 0 || u > 1) continue;
    const qx = sy*e1z-sz*e1y, qy = sz*e1x-sx*e1z, qz = sx*e1y-sy*e1x;
    const v = (dx*qx + dy*qy + dz*qz) * inv;
    if (v < 0 || u + v > 1) continue;
    const tHit = (e2x*qx + e2y*qy + e2z*qz) * inv;
    if (tHit <= 0 || (best && tHit >= best.t)) continue;
    best = { t: tHit, point: [ox+dx*tHit, oy+dy*tHit, oz+dz*tHit], tri: i, u, v };
  }
  return best;
}

const HAND_MAX_REACH = 2.5;
const HAND_MAX_PULL_SPEED = 8; // world units per second
const HAND_WHEEL_TWIST = 0.004; // radians per wheel pixel
const HAND_GRAB_RADIUS = 0.4;
const HAND_COMPLIANCE = 5e-5;
const HAND_PICK_TOLERANCE = 0.02; // ray-to-vertex distance per unit of ray length

// Fallback for clicks that land on (or a hair outside) a silhouette tip or corner, where the exact
// triangle test misses: take the closest surface vertex to the ray within a small cone.
function pickBodyNearVertex(body, ray) {
  const p = body.positions, tris = body.surfaceTris;
  const [ox, oy, oz] = ray.origin, [dx, dy, dz] = ray.dir;
  let best = null, bestScore = Infinity;
  for (let i = 0; i < tris.length; i++) {
    const v = tris[i];
    const rx = p[v*3]-ox, ry = p[v*3+1]-oy, rz = p[v*3+2]-oz;
    const t = rx*dx + ry*dy + rz*dz;
    if (t <= 0) continue;
    const px = rx - dx*t, py = ry - dy*t, pz = rz - dz*t;
    const perp = Math.hypot(px, py, pz);
    if (perp > HAND_PICK_TOLERANCE * t) continue;
    const score = perp / t + t * 1e-3;
    if (score < bestScore) { bestScore = score; best = { t, point: [p[v*3], p[v*3+1], p[v*3+2]], tri: Math.floor(i / 3) }; }
  }
  return best;
}

function createGrab(body, hitPoint, hitTri, viewAxis) {
  const p = body.positions;
  const r2 = HAND_GRAB_RADIUS * HAND_GRAB_RADIUS;
  const indices = [], weights = [];
  for (let i = 0; i < body.particleCount; i++) {
    if (body.invMass[i] === 0) continue;
    const dx = p[i*3]-hitPoint[0], dy = p[i*3+1]-hitPoint[1], dz = p[i*3+2]-hitPoint[2];
    const d2 = dx*dx + dy*dy + dz*dz;
    if (d2 > r2) continue;
    // Firm grip across the whole patch (a hand, not a pin): the rim keeps enough weight to carry
    // twists, while the centre still holds hardest.
    indices.push(i);
    weights.push(0.4 + 0.6 * (1 - d2 / r2));
  }
  if (indices.length === 0) {
    // Thin tips/corners can leave no particle inside the radius; fall back to the hit triangle's
    // nearest vertex so a grab never silently does nothing.
    let nearest = -1, nearestD2 = Infinity;
    for (let k = 0; k < 3; k++) {
      const v = body.surfaceTris[hitTri*3+k];
      const dx = p[v*3]-hitPoint[0], dy = p[v*3+1]-hitPoint[1], dz = p[v*3+2]-hitPoint[2];
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 < nearestD2) { nearestD2 = d2; nearest = v; }
    }
    indices.push(nearest);
    weights.push(1);
  }
  const offsets = new Float32Array(indices.length * 3);
  for (let j = 0; j < indices.length; j++) {
    const i = indices[j];
    offsets[j*3]   = p[i*3]   - hitPoint[0];
    offsets[j*3+1] = p[i*3+1] - hitPoint[1];
    offsets[j*3+2] = p[i*3+2] - hitPoint[2];
  }
  return {
    body,
    indices: new Uint32Array(indices),
    weights: new Float32Array(weights),
    offsets,
    start: hitPoint.slice(),
    target: hitPoint.slice(),
    twist: 0,
    axis: viewAxis,
    compliance: HAND_COMPLIANCE,
  };
}

function createHandTool({ canvas, getBodies, getInvViewProj, getEye, floorY, isActive }) {
  const pointers = new Map(); // pointerId -> { grab } | { twistOf: pointerId, lastAngle }

  function eventRay(e) {
    return screenToRay(e.clientX, e.clientY, getInvViewProj(), canvas.getBoundingClientRect());
  }

  function updateCursor() {
    if (!isActive()) return;
    let grabbing = false;
    for (const entry of pointers.values()) if (entry.grab) grabbing = true;
    canvas.style.cursor = grabbing ? 'grabbing' : 'grab';
  }

  function releaseGrab(id) {
    const entry = pointers.get(id);
    if (!entry) return;
    if (entry.twistOf !== undefined) {
      const owner = pointers.get(entry.twistOf);
      if (owner) owner.twistFinger = undefined;
    }
    if (entry.grab) {
      const list = entry.grab.body.grabs;
      const at = list.indexOf(entry.grab);
      if (at >= 0) list.splice(at, 1);
      for (const [otherId, other] of pointers) if (other.twistOf === id) pointers.delete(otherId);
    }
    pointers.delete(id);
    updateCursor();
  }

  function onDown(e) {
    if (!isActive()) return;
    if (pointers.has(e.pointerId)) releaseGrab(e.pointerId);
    const ray = eventRay(e);
    let best = null, bestBody = null;
    for (const body of getBodies()) {
      const hit = pickBody(body, ray);
      if (hit && (!best || hit.t < best.t)) { best = hit; bestBody = body; }
    }
    if (!best) {
      for (const body of getBodies()) {
        const hit = pickBodyNearVertex(body, ray);
        if (hit && (!best || hit.t < best.t)) { best = hit; bestBody = body; }
      }
    }
    if (best) {
      const eye = getEye();
      const ax = best.point[0]-eye[0], ay = best.point[1]-eye[1], az = best.point[2]-eye[2];
      const len = Math.hypot(ax, ay, az) || 1;
      const grab = createGrab(bestBody, best.point, best.tri, [ax/len, ay/len, az/len]);
      bestBody.grabs.push(grab);
      pointers.set(e.pointerId, { grab, x: e.clientX, y: e.clientY, type: e.pointerType });
      canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
      updateCursor();
      return;
    }
    onDownMiss(e);
  }

  // A touch that misses the jelly while a finger is already holding it becomes that grab's twist
  // finger: rotating it around the holding finger twists the grabbed patch.
  function onDownMiss(e) {
    if (e.pointerType !== 'touch') return;
    let ownerId = null;
    for (const [id, entry] of pointers) {
      if (entry.grab && entry.type === 'touch' && entry.twistFinger === undefined) ownerId = id;
    }
    if (ownerId === null) return;
    const owner = pointers.get(ownerId);
    owner.twistFinger = e.pointerId;
    pointers.set(e.pointerId, {
      twistOf: ownerId, x: e.clientX, y: e.clientY, type: e.pointerType,
      lastAngle: Math.atan2(e.clientY - owner.y, e.clientX - owner.x),
    });
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  function updateTwist(ownerId) {
    const owner = pointers.get(ownerId);
    if (!owner || owner.twistFinger === undefined) return;
    const finger = pointers.get(owner.twistFinger);
    if (!finger) return;
    const angle = Math.atan2(finger.y - owner.y, finger.x - owner.x);
    let delta = angle - finger.lastAngle;
    if (delta > Math.PI) delta -= 2 * Math.PI; else if (delta < -Math.PI) delta += 2 * Math.PI;
    finger.lastAngle = angle;
    owner.grab.twist += delta;
  }

  function onWheel(e) {
    if (!isActive()) return;
    let latest = null;
    for (const entry of pointers.values()) if (entry.grab) latest = entry;
    if (!latest) return;
    e.preventDefault();
    const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
    latest.grab.twist += -e.deltaY * scale * HAND_WHEEL_TWIST;
  }

  function onMove(e) {
    const entry = pointers.get(e.pointerId);
    if (!entry) return;
    if (e.pointerType === 'mouse' && e.buttons === 0) { releaseGrab(e.pointerId); return; }
    entry.x = e.clientX; entry.y = e.clientY;
    if (entry.twistOf !== undefined) { updateTwist(entry.twistOf); return; }
    if (!entry.grab) return;
    if (entry.twistFinger !== undefined) updateTwist(e.pointerId);
    const g = entry.grab;
    const ray = eventRay(e);
    const [nx, ny, nz] = g.axis;
    const denom = ray.dir[0]*nx + ray.dir[1]*ny + ray.dir[2]*nz;
    if (Math.abs(denom) < 1e-6) return;
    const tPlane = ((g.start[0]-ray.origin[0])*nx + (g.start[1]-ray.origin[1])*ny + (g.start[2]-ray.origin[2])*nz) / denom;
    if (tPlane <= 0) return;
    let dx = ray.origin[0] + ray.dir[0]*tPlane - g.start[0];
    let dy = ray.origin[1] + ray.dir[1]*tPlane - g.start[1];
    let dz = ray.origin[2] + ray.dir[2]*tPlane - g.start[2];
    const dist = Math.hypot(dx, dy, dz);
    if (dist > HAND_MAX_REACH) { const s = HAND_MAX_REACH / dist; dx *= s; dy *= s; dz *= s; }
    g.target[0] = g.start[0] + dx;
    g.target[1] = Math.max(floorY + 0.05, g.start[1] + dy);
    g.target[2] = g.start[2] + dz;
  }

  function onUp(e) { releaseGrab(e.pointerId); }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  // A missed pointerup (capture stolen, window blurred mid-drag) would otherwise pin the jelly
  // to an orphaned grab forever.
  canvas.addEventListener('lostpointercapture', onUp);
  canvas.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointermove', (e) => { if (pointers.has(e.pointerId) && e.target !== canvas) onMove(e); });
  const releaseAll = () => { for (const id of [...pointers.keys()]) releaseGrab(id); };
  window.addEventListener('blur', releaseAll);
  updateCursor();

  return { pointers, releaseAll };
}

function createFloorRenderer(device, format, floorY) {
  const shaderCode = `
    struct Uniforms { viewProj: mat4x4<f32> };
    @group(0) @binding(0) var<uniform> uniforms: Uniforms;
    struct VSOut { @builtin(position) pos: vec4<f32>, @location(0) worldPos: vec3<f32> };
    @vertex
    fn vs_main(@location(0) position: vec3<f32>) -> VSOut {
      var out: VSOut;
      out.pos = uniforms.viewProj * vec4<f32>(position, 1.0);
      out.worldPos = position;
      return out;
    }
    @fragment
    fn fs_main(in: VSOut) -> @location(0) vec4<f32> {
      // Slightly darker than the page's clear colour so the floor reads as a distinct surface,
      // with a soft radial falloff toward the horizon for a studio-paper feel.
      let d = length(in.worldPos.xz) / 14.0;
      let shade = mix(0.885, 0.80, clamp(d, 0.0, 1.0));
      return vec4<f32>(shade, shade * 0.986, shade * 0.965, 1.0);
    }
  `;
  const module = device.createShaderModule({ code: shaderCode });
  const size = 20;
  const verts = new Float32Array([
    -size, floorY, -size,  size, floorY, -size,  size, floorY, size,
    -size, floorY, -size,  size, floorY, size,  -size, floorY, size,
  ]);
  const vertexBuffer = device.createBuffer({ size: verts.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(vertexBuffer, 0, verts);

  const uniformBuffer = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bindGroupLayout = device.createBindGroupLayout({
    entries: [{ binding: 0, visibility: GPUShaderStage.VERTEX, buffer: {} }],
  });
  const bindGroup = device.createBindGroup({
    layout: bindGroupLayout,
    entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
  });
  const pipeline = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] }),
    vertex: {
      module, entryPoint: 'vs_main',
      buffers: [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }],
    },
    fragment: { module, entryPoint: 'fs_main', targets: [{ format }] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
  });

  return {
    render(passEncoder, viewProj) {
      device.queue.writeBuffer(uniformBuffer, 0, viewProj);
      passEncoder.setPipeline(pipeline);
      passEncoder.setBindGroup(0, bindGroup);
      passEncoder.setVertexBuffer(0, vertexBuffer);
      passEncoder.draw(6);
    },
  };
}

function createWireframeRenderer(device, format) {
  const shaderCode = `
    struct Uniforms { viewProj: mat4x4<f32> };
    @group(0) @binding(0) var<uniform> uniforms: Uniforms;
    @vertex
    fn vs_main(@location(0) position: vec3<f32>) -> @builtin(position) vec4<f32> {
      return uniforms.viewProj * vec4<f32>(position, 1.0);
    }
    @fragment
    fn fs_main() -> @location(0) vec4<f32> {
      return vec4<f32>(0.1, 0.1, 0.1, 1.0);
    }
  `;
  const module = device.createShaderModule({ code: shaderCode });
  const uniformBuffer = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bindGroupLayout = device.createBindGroupLayout({
    entries: [{ binding: 0, visibility: GPUShaderStage.VERTEX, buffer: {} }],
  });
  const bindGroup = device.createBindGroup({
    layout: bindGroupLayout,
    entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
  });
  const pipeline = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] }),
    vertex: { module, entryPoint: 'vs_main', buffers: [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }] },
    fragment: { module, entryPoint: 'fs_main', targets: [{ format }] },
    primitive: { topology: 'line-list' },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
  });

  let lineBuffer = null;
  let lineBufferCapacity = 0;
  let scratch = null;

  return {
    render(passEncoder, viewProj, body) {
      const needed = body.edgeCount * 2 * 3;
      if (!lineBuffer || lineBufferCapacity < needed) {
        if (lineBuffer) lineBuffer.destroy();
        lineBuffer = device.createBuffer({ size: needed * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
        lineBufferCapacity = needed;
        scratch = new Float32Array(needed);
      }
      const data = scratch;
      const edges = body.edges, positions = body.positions;
      let o = 0;
      for (let ei = 0; ei < body.edgeCount; ei++) {
        const a = edges[ei*2], b = edges[ei*2+1];
        data[o++] = positions[a*3]; data[o++] = positions[a*3+1]; data[o++] = positions[a*3+2];
        data[o++] = positions[b*3]; data[o++] = positions[b*3+1]; data[o++] = positions[b*3+2];
      }
      device.queue.writeBuffer(lineBuffer, 0, data, 0, needed);
      device.queue.writeBuffer(uniformBuffer, 0, viewProj);
      passEncoder.setPipeline(pipeline);
      passEncoder.setBindGroup(0, bindGroup);
      passEncoder.setVertexBuffer(0, lineBuffer);
      passEncoder.draw(body.edgeCount * 2);
    },
  };
}

function layerStiffnessFn(restY) {
  // bottom firmest, top softest, 6 bands across [-0.7, 0.7]
  const t = Math.min(1, Math.max(0, (restY + 0.7) / 1.4));
  return 1.6 - 1.0 * t; // 1.6 at bottom, 0.6 at top
}

let depthTexture = null;
function getDepthTexture(device, width, height) {
  if (depthTexture && depthTexture.width === width && depthTexture.height === height) return depthTexture;
  if (depthTexture) depthTexture.destroy();
  depthTexture = device.createTexture({
    size: [width, height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT,
  });
  return depthTexture;
}

async function main() {
  try {
    await initWebGPU();
  } catch (err) {
    console.error('WebGPU init failed:', err);
    showFallback();
    return;
  }

  const mesh = buildJellyMesh({});
  const body = new SoftBody(mesh, { layerStiffness: layerStiffnessFn });
  console.log('Jelly mesh ready:', body.particleCount, 'particles,', body.tetCount, 'tets');

  const floorY = -0.7;
  // Spawn the bar above the floor (rest geometry's own bottom sits at floorY already) so the fall
  // and settle are actually visible, per the plan's "falling under gravity and settling" check.
  const spawnLift = 1.5;
  for (let i = 1; i < body.positions.length; i += 3) {
    body.positions[i] += spawnLift;
    body.prevPositions[i] += spawnLift;
  }

  const floorRenderer = createFloorRenderer(app.device, app.format, floorY);
  const wireRenderer = createWireframeRenderer(app.device, app.format);
  const clock = new Clock(60);

  const physicsParams = { firmness: 0.5, damping: 0.5, gravity: [0, -9.8, 0], floorY, substeps: 10 };

  // Debug handle for manual slider-extreme checks (console-driven, until the Phase 5 UI sliders
  // exist) — the plan's own Task 1.4 verification step needs this to reach physicsParams.
  const bodies = [body];
  let invViewProj = mat4.invert(getViewProjMatrix(camera, app.width / app.height));
  const hand = createHandTool({
    canvas: app.canvas,
    getBodies: () => bodies,
    getInvViewProj: () => invViewProj,
    getEye: () => camera.eye,
    floorY,
    isActive: () => true,
  });

  window.__jelly = { body, bodies, physicsParams, clock, hand };

  function physicsStep(dt) {
    const subDt = dt / physicsParams.substeps;
    for (let i = 0; i < physicsParams.substeps; i++) {
      body.step(subDt, physicsParams);
    }
  }

  function frame(nowMs) {
    resizeCanvas();
    clock.tick(nowMs, physicsStep);

    const aspect = app.width / app.height;
    const viewProj = getViewProjMatrix(camera, aspect);
    invViewProj = mat4.invert(viewProj) || invViewProj;
    const depthTex = getDepthTexture(app.device, app.width, app.height);

    const encoder = app.device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments: [{
        view: app.context.getCurrentTexture().createView(),
        clearValue: { r: 0.953, g: 0.937, b: 0.910, a: 1 },
        loadOp: 'clear', storeOp: 'store',
      }],
      depthStencilAttachment: {
        view: depthTex.createView(), depthClearValue: 1.0, depthLoadOp: 'clear', depthStoreOp: 'store',
      },
    });
    floorRenderer.render(pass, viewProj);
    wireRenderer.render(pass, viewProj, body);
    pass.end();
    app.device.queue.submit([encoder.finish()]);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

main();
</script>
